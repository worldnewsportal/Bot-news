name: Automated AI Telegram News Bot

on:
  schedule:
    # يعمل تلقائياً كل 10 ساعات
    - cron: '0 */10 * * *'
  workflow_dispatch: # يسمح بالتشغيل اليدوي من واجهة GitHub

permissions:
  contents: write # صلاحية الكتابة لحفظ الـ Cache تلقائياً

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    
    # حل مشكلة الاستيرادات بتعيين المسار الرئيسي للبايثون
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, installing core dependencies directly..."
            pip install aiohttp feedparser beautifulsoup4 pydantic pytest pytest-asyncio
          fi

      - name: Ensure Package Init Files Exist
        run: |
          mkdir -p data tests config models collectors processors ai telegram cache utils
          for dir in config models collectors processors ai telegram cache utils tests; do
            touch "$dir/__init__.py"
          done
          if [ ! -f data/published_cache.json ]; then
            echo '{"published_ids": []}' > data/published_cache.json
          fi

      - name: Run Unit Tests
        run: |
          if [ -d tests ] && [ "$(ls -A tests)" ]; then
            python -m pytest tests/
          else
            echo "No test files found, skipping unit tests step."
          fi

      - name: Run News Bot Pipeline
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          python main.py

      - name: Commit and Push Cache Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/published_cache.json
          git diff-index --quiet HEAD || (git commit -m "auto: update published cache [skip ci]" && git push)
